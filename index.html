<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vetcongweb — Procedural Maps</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #0f0; }
    canvas { display: block; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; font-size: 13px; text-shadow: 0 0 4px #000; }
    #hud { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none; display: flex; gap: 24px; font-size: 16px; text-shadow: 0 0 6px #000; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; margin: -7px; border: 2px solid #0f0; border-radius: 50%; pointer-events: none; }
    #mapSelect { position: absolute; top: 10px; right: 10px; z-index: 10; background: #111; color: #0f0; border: 1px solid #0f0; padding: 4px; }
  </style>
</head>
<body>
  <div id="info">WASD | Space | R reload | Click shoot<br>Procedural Stream / Halong Port (reference only)</div>
  <select id="mapSelect">
    <option value="stream">Stream</option>
    <option value="halong">Halong Port</option>
  </select>
  <div id="hud">
    <div>HP: <span id="health">100</span></div>
    <div>AMMO: <span id="ammo">30/90</span></div>
    <div>SCORE: <span id="score">0</span></div>
    <div>MP: <span id="mp">OFFLINE</span></div>
    <div>MAP: <span id="map">STREAM</span></div>
  </div>
  <div id="crosshair"></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
